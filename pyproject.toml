[project]
name = "photo-slideshow"
version = "0.1.0"
description = "Local photo-to-video slideshow MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.20",
  "pillow==11.3.0",
  "pillow-heif==1.1.0",
  "pydantic-settings==2.10.1",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires ffmpeg and ffprobe"]

